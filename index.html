<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PSR-SX / Cumbia Studio</title>
  <style>
    * {
      box-sizing: border-box;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      margin: 0;
      padding: 8px;
      background: #070d16;
      color: #f8fafc;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
    }

    .studio-console {
      width: 100%;
      max-width: 1180px;
      background: linear-gradient(180deg, #162233 0%, #0d1624 100%);
      border: 1px solid #294163;
      border-radius: 12px;
      padding: 10px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.55);
    }

    .top-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #09121e;
      border: 1px solid #1e3554;
      border-radius: 8px;
      padding: 8px 10px;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .brand-title {
      font-size: 0.9rem;
      font-weight: 800;
      letter-spacing: 0.06em;
      color: #38bdf8;
    }

    .midi-badge {
      font-size: 0.72rem;
      padding: 3px 8px;
      border-radius: 999px;
      background: #13253b;
      border: 1px solid #2b5482;
      color: #93c5fd;
    }

    .transport-group {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px;
    }

    .beat-leds {
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 0 6px;
    }

    .beat-dot {
      width: 9px;
      height: 9px;
      border-radius: 50%;
      background: #1e293b;
      border: 1px solid #334155;
    }

    .beat-dot.on {
      background: #38bdf8;
      box-shadow: 0 0 8px #38bdf8;
    }

    .beat-dot.on-first {
      background: #fbbf24;
      box-shadow: 0 0 8px #fbbf24;
    }

    .tempo-box,
    .vol-box {
      display: flex;
      align-items: center;
      gap: 4px;
      font-size: 0.75rem;
      color: #cbd5e1;
    }

    .tempo-box input {
      width: 54px;
      background: #0f1d30;
      color: #fbbf24;
      border: 1px solid #2b5482;
      border-radius: 5px;
      padding: 3px 6px;
      font-weight: 700;
      text-align: center;
    }

    .vol-box input[type="range"] {
      width: 82px;
      accent-color: #38bdf8;
    }

    .hw-btn {
      background: #152438;
      color: #e2e8f0;
      border: 1px solid #2d4b73;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.74rem;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      transition: transform 0.05s ease, background 0.15s ease, border-color 0.15s ease;
    }

    .hw-btn:active {
      transform: scale(0.98);
    }

    .hw-btn.small {
      padding: 4px 8px;
      font-size: 0.68rem;
    }

    .hw-btn .led {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #334155;
    }

    .hw-btn.active {
      background: #183659;
      border-color: #38bdf8;
      color: #ffffff;
    }

    .hw-btn.led-blue.active .led {
      background: #38bdf8;
      box-shadow: 0 0 7px #38bdf8;
    }

    .hw-btn.led-amber.active .led {
      background: #fbbf24;
      box-shadow: 0 0 7px #fbbf24;
    }

    .hw-btn.led-red.active .led {
      background: #f87171;
      box-shadow: 0 0 7px #f87171;
    }

    .main-panel {
      display: grid;
      grid-template-columns: 1.25fr 0.95fr;
      gap: 10px;
    }

    @media (max-width: 900px) {
      .main-panel {
        grid-template-columns: 1fr;
      }
    }

    .lcd-panel {
      background: #08121f;
      border: 2px solid #264873;
      border-radius: 10px;
      padding: 8px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 330px;
    }

    .lcd-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #0d1c30;
      border: 1px solid #1e3a5f;
      border-radius: 6px;
      padding: 6px 10px;
      font-size: 0.78rem;
      font-weight: 800;
    }

    .lcd-chord {
      color: #34d399;
      font-size: 0.9rem;
    }

    .lcd-section {
      color: #fbbf24;
    }

    .lcd-body {
      flex: 1;
      min-height: 225px;
      overflow: hidden;
    }

    .tft-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
      border-top: 1px solid #1c3554;
      padding-top: 7px;
    }

    .tft-tab {
      flex: 1;
      min-width: 78px;
      background: #102036;
      color: #94a3b8;
      border: 1px solid #234166;
      border-radius: 6px;
      padding: 6px 6px;
      font-size: 0.68rem;
      font-weight: 800;
      cursor: pointer;
      text-align: center;
    }

    .tft-tab.active {
      background: #1d4ed8;
      border-color: #60a5fa;
      color: #ffffff;
    }

    .sx-home-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 6px;
    }

    .sx-tile {
      background: #0c192b;
      border: 1px solid #1f3b5e;
      border-radius: 6px;
      padding: 6px 8px;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .sx-tile-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.64rem;
      font-weight: 800;
      color: #7dd3fc;
      letter-spacing: 0.03em;
    }

    .sx-tile-title {
      font-size: 0.88rem;
      font-weight: 800;
      color: #f8fafc;
    }

    .sx-tile-sub {
      font-size: 0.66rem;
      color: #94a3b8;
    }

    .voice-slot {
      display: flex;
      flex-direction: column;
      gap: 3px;
      font-size: 0.72rem;
    }

    .voice-slot select {
      width: 100%;
      background: #13253b;
      color: #f8fafc;
      border: 1px solid #2b5482;
      border-radius: 4px;
      padding: 3px 5px;
      font-size: 0.68rem;
    }

    .mixer-grid {
      display: grid;
      grid-template-columns: repeat(8, 1fr);
      gap: 6px;
      padding-top: 6px;
    }

    @media (max-width: 640px) {
      .mixer-grid {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .mixer-strip {
      background: #0c192b;
      border: 1px solid #1f3b5e;
      border-radius: 6px;
      padding: 6px 4px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
    }

    .mixer-ch-name {
      font-size: 0.64rem;
      font-weight: 800;
      color: #93c5fd;
    }

    .mixer-strip input[type="range"] {
      writing-mode: vertical-lr;
      direction: rtl;
      height: 85px;
      width: 18px;
      accent-color: #38bdf8;
    }

    .mixer-val {
      font-size: 0.65rem;
      color: #fbbf24;
      font-weight: 700;
    }

    .controls-column {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .hw-card {
      background: #0b1524;
      border: 1px solid #1e3656;
      border-radius: 8px;
      padding: 7px 8px;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .hw-card-title {
      font-size: 0.68rem;
      font-weight: 800;
      color: #93c5fd;
      letter-spacing: 0.05em;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
    }

    .grid-4 {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 5px;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 5px;
    }

    .chord-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 4px;
    }

    @media (max-width: 560px) {
      .chord-row {
        grid-template-columns: repeat(4, 1fr);
      }
    }

    .perf-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      background: #09121e;
      border: 1px solid #1e3554;
      border-radius: 8px;
      padding: 6px 10px;
    }

    .joystick-pad {
      width: 54px;
      height: 54px;
      border-radius: 10px;
      background: #102036;
      border: 1px solid #2b5482;
      position: relative;
      touch-action: none;
      cursor: grab;
    }

    .joystick-stick {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: #38bdf8;
      border: 2px solid #e0f2fe;
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .keyboard-wrap {
      background: #060b12;
      border: 1px solid #1e3554;
      border-radius: 10px;
      padding: 8px;
      overflow-x: auto;
    }

    .keyboard {
      position: relative;
      height: 145px;
      min-width: 680px;
      display: flex;
      touch-action: none;
    }

    .key-white {
      flex: 1;
      height: 100%;
      background: linear-gradient(180deg, #f8fafc 0%, #e2e8f0 100%);
      border: 1px solid #0f172a;
      border-radius: 0 0 6px 6px;
      color: #0f172a;
      font-size: 0.65rem;
      font-weight: 700;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 6px;
      cursor: pointer;
    }

    .key-white.split-zone {
      background: linear-gradient(180deg, #e0f2fe 0%, #bae6fd 100%);
    }

    .key-white.active {
      background: #38bdf8;
      color: #ffffff;
    }

    .key-black {
      position: absolute;
      top: 0;
      width: 2.1%;
      height: 62%;
      background: linear-gradient(180deg, #334155 0%, #090d16 100%);
      border: 1px solid #020617;
      border-radius: 0 0 4px 4px;
      z-index: 2;
      cursor: pointer;
    }

    .key-black.active {
      background: #fbbf24;
    }
  </style>
</head>
<body>
  <div class="studio-console">
    <header class="top-bar">
      <div class="brand-group">
        <span class="brand-title">PSR-SX / CUMBIA STUDIO</span>
        <span id="midiStatus" class="midi-badge">MIDI: Buscando...</span>
      </div>

      <div class="transport-group">
        <button id="btnStartStop" class="hw-btn led-red"><span class="led"></span>START / STOP</button>
        <button id="btnTapTempo" class="hw-btn small">TAP TEMPO</button>

        <div class="beat-leds">
          <span class="beat-dot"></span>
          <span class="beat-dot"></span>
          <span class="beat-dot"></span>
          <span class="beat-dot"></span>
        </div>

        <div class="tempo-box">
          <button id="btnTempoDown" class="hw-btn small">-</button>
          <input id="inputTempo" type="number" min="40" max="280" value="104" />
          <button id="btnTempoUp" class="hw-btn small">+</button>
        </div>

        <div class="vol-box">
          <span>VOL</span>
          <input id="masterVolume" type="range" min="0" max="1" step="0.02" value="0.85" />
        </div>
      </div>
    </header>

    <section class="main-panel">
      <div class="lcd-panel">
        <div class="lcd-header">
          <span>ACMP: <span id="chordDisplay" class="lcd-chord">Cmaj7</span></span>
          <span id="lcdSectionBadge" class="lcd-section">MAIN A (2B)</span>
        </div>

        <div id="tabContent" class="lcd-body"></div>

        <div class="tft-tabs">
          <button class="tft-tab active" data-tab="main">HOME</button>
          <button class="tft-tab" data-tab="mixer">MIXER / EQ</button>
          <button class="tft-tab" data-tab="sounds">SOUNDS</button>
          <button class="tft-tab" data-tab="files">EXPANSION / FILES</button>
          <button class="tft-tab" data-tab="creator">STYLE CREATOR</button>
          <button class="tft-tab" data-tab="latency">UTILITY / AUDIO</button>
        </div>
      </div>

      <div class="controls-column">
        <div class="hw-card">
          <span class="hw-card-title">STYLE CONTROL</span>
          <div class="grid-3">
            <button class="hw-btn small led-blue style-sec" data-section="INTRO A"><span class="led"></span>INTRO A</button>
            <button class="hw-btn small led-blue active style-sec" data-section="MAIN A"><span class="led"></span>MAIN A</button>
            <button class="hw-btn small led-blue style-sec" data-section="MAIN B"><span class="led"></span>MAIN B</button>
            <button class="hw-btn small led-amber style-sec" data-section="FILL A"><span class="led"></span>FILL A</button>
            <button class="hw-btn small led-amber style-sec" data-section="BREAK"><span class="led"></span>BREAK</button>
            <button class="hw-btn small led-red style-sec" data-section="ENDING A"><span class="led"></span>ENDING A</button>
          </div>
          <div class="grid-2">
            <button id="btnAcmp" class="hw-btn small led-blue active"><span class="led"></span>ACMP</button>
            <button id="btnAutoFill" class="hw-btn small led-blue active"><span class="led"></span>AUTO FILL</button>
            <button id="btnSyncStart" class="hw-btn small led-amber active"><span class="led"></span>SYNC START</button>
            <button id="btnSyncStop" class="hw-btn small led-amber"><span class="led"></span>SYNC STOP</button>
          </div>
        </div>

        <div class="hw-card">
          <span class="hw-card-title">ONE TOUCH SETTING (OTS)</span>
          <div class="grid-4">
            <button class="hw-btn small led-amber active ots-btn" data-ots="0"><span class="led"></span>1</button>
            <button class="hw-btn small led-amber ots-btn" data-ots="1"><span class="led"></span>2</button>
            <button class="hw-btn small led-amber ots-btn" data-ots="2"><span class="led"></span>3</button>
            <button class="hw-btn small led-amber ots-btn" data-ots="3"><span class="led"></span>4</button>
          </div>
        </div>

        <div class="hw-card">
          <span class="hw-card-title">PART SELECT / ON-OFF</span>
          <div class="grid-3">
            <button id="btnPartR1" class="hw-btn small led-blue active"><span class="led"></span>RIGHT 1</button>
            <button id="btnPartR2" class="hw-btn small led-blue"><span class="led"></span>RIGHT 2</button>
            <button id="btnPartLeft" class="hw-btn small led-blue active"><span class="led"></span>LEFT</button>
          </div>
          <div class="grid-2">
            <button id="btnLeftHold" class="hw-btn small led-amber"><span class="led"></span>LEFT HOLD</button>
            <button id="btnHarmony" class="hw-btn small led-amber"><span class="led"></span>HARMONY/ECHO</button>
          </div>
        </div>

        <div class="hw-card">
          <span class="hw-card-title">MULTI PAD CONTROL</span>
          <div class="grid-4">
            <button class="hw-btn small led-red pad-btn" data-pad="0"><span class="led"></span>1</button>
            <button class="hw-btn small led-red pad-btn" data-pad="1"><span class="led"></span>2</button>
            <button class="hw-btn small led-red pad-btn" data-pad="2"><span class="led"></span>3</button>
            <button class="hw-btn small led-red pad-btn" data-pad="3"><span class="led"></span>4</button>
          </div>
          <button id="btnPadStop" class="hw-btn small">⏹ STOP PAD / AUDIO</button>
        </div>
      </div>
    </section>

    <section class="hw-card">
      <span class="hw-card-title">CHORD FINGERING / ACMP PAD</span>
      <div class="chord-row">
        <button class="hw-btn small chord-btn active" data-chord="Cmaj7">Cmaj7</button>
        <button class="hw-btn small chord-btn" data-chord="Dm7">Dm7</button>
        <button class="hw-btn small chord-btn" data-chord="Em7">Em7</button>
        <button class="hw-btn small chord-btn" data-chord="Fmaj7">Fmaj7</button>
        <button class="hw-btn small chord-btn" data-chord="G7">G7</button>
        <button class="hw-btn small chord-btn" data-chord="Am7">Am7</button>
        <button class="hw-btn small chord-btn" data-chord="Bm7b5">Bm7b5</button>
      </div>
    </section>

    <section class="perf-row">
      <div style="display:flex;align-items:center;gap:8px;">
        <div id="joystickPad" class="joystick-pad" title="Pitch Bend">
          <div id="joystickStick" class="joystick-stick"></div>
        </div>
        <span style="font-size:0.72rem;color:#94a3b8;">PITCH BEND</span>
      </div>

      <div style="display:flex;align-items:center;gap:6px;">
        <span style="font-size:0.72rem;color:#cbd5e1;">TRANSPOSE:</span>
        <button id="btnTransDown" class="hw-btn small">-</button>
        <strong id="transposeVal" style="min-width:24px;text-align:center;color:#fbbf24;">0</strong>
        <button id="btnTransUp" class="hw-btn small">+</button>
      </div>
    </section>

    <section class="keyboard-wrap">
      <div id="keyboard" class="keyboard"></div>
    </section>
  </div>

  <script src="js/gm-xg-map.js"></script>
  <script src="js/audio-engine.js"></script>
  <script src="js/sty-engine.js"></script>
  <script src="js/sound-library.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
