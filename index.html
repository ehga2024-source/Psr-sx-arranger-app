<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>PSR-SX Workstation — 15 Banks • Pads • OTS</title>
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <div class="workstation-shell">
    <!-- BARRA SUPERIOR DE TRANSPORTE, TEMPO, ACORDE Y VOLUMEN -->
    <header class="top-transport-bar">
      <div class="transport-group">
        <button type="button" id="btnStartStop" class="hw-btn led-red" title="Start / Stop">
          <span class="led"></span>START/STOP
        </button>
        <button type="button" id="btnTapTempo" class="hw-btn small" title="Tap Tempo">TAP TEMPO</button>
        <div class="tempo-box">
          <button type="button" id="btnTempoDown" class="hw-btn small">-</button>
          <input type="number" id="inputTempo" min="40" max="280" value="100" aria-label="Tempo BPM" />
          <button type="button" id="btnTempoUp" class="hw-btn small">+</button>
        </div>
        <div class="beat-leds" aria-label="Beat indicator">
          <span class="beat-dot"></span>
          <span class="beat-dot"></span>
          <span class="beat-dot"></span>
          <span class="beat-dot"></span>
        </div>
      </div>

      <div class="lcd-mini-status">
        <div class="lcd-line-top">
          <span>ACMP: <strong id="chordDisplay">C</strong></span>
          <span id="lcdStyleName">C Mayor — Style Converter</span>
          <span id="lcdSectionBadge">MAIN A (2B)</span>
        </div>
      </div>

      <div class="transport-group right-controls">
        <div class="transpose-box">
          <span>TRANS</span>
          <button type="button" id="btnTransDown" class="hw-btn small">-</button>
          <strong id="transposeVal">0</strong>
          <button type="button" id="btnTransUp" class="hw-btn small">+</button>
        </div>
        <label class="vol-control">
          <span>VOL</span>
          <input type="range" id="masterVolume" min="0" max="1.2" step="0.02" value="0.85" />
        </label>
        <span id="midiStatus" class="midi-badge">MIDI: Ready</span>
      </div>
    </header>

    <!-- CUERPO PRINCIPAL -->
    <main class="panel-grid">
      <!-- PANEL CENTRAL: PANTALLA TFT + PESTAÑAS + CONTROLES -->
      <section class="center-panel">
        <div class="tft-screen">
          <div id="tabContent" class="tft-content"></div>
        </div>

        <nav class="tft-tabs" aria-label="Pantallas">
          <button type="button" class="tft-tab" data-tab="main">HOME</button>
          <button type="button" class="tft-tab" data-tab="mixer">MIXER / EQ</button>
          <button type="button" class="tft-tab active" data-tab="sounds">SOUNDS</button>
          <button type="button" class="tft-tab" data-tab="files">EXPANSION / FILES</button>
          <button type="button" class="tft-tab" data-tab="creator">STYLE CREATOR</button>
          <button type="button" class="tft-tab" data-tab="latency">UTILITY / AUDIO</button>
        </nav>

        <!-- STYLE CONTROL -->
        <div class="control-block">
          <div class="block-title">STYLE CONTROL</div>
          <div class="grid-3">
            <button type="button" class="hw-btn style-sec" data-section="INTRO A"><span class="led"></span>INTRO A</button>
            <button type="button" class="hw-btn style-sec active" data-section="MAIN A"><span class="led"></span>MAIN A</button>
            <button type="button" class="hw-btn style-sec" data-section="MAIN B"><span class="led"></span>MAIN B</button>
            <button type="button" class="hw-btn style-sec" data-section="FILL A"><span class="led"></span>FILL A</button>
            <button type="button" class="hw-btn style-sec" data-section="BREAK"><span class="led"></span>BREAK</button>
            <button type="button" class="hw-btn style-sec" data-section="ENDING A"><span class="led"></span>ENDING A</button>
          </div>
          <div class="grid-2 mt-6">
            <button type="button" id="btnAcmp" class="hw-btn led-amber active"><span class="led"></span>ACMP</button>
            <button type="button" id="btnAutoFill" class="hw-btn led-amber active"><span class="led"></span>AUTO FILL</button>
            <button type="button" id="btnSyncStart" class="hw-btn led-amber active"><span class="led"></span>SYNC START</button>
            <button type="button" id="btnSyncStop" class="hw-btn led-amber"><span class="led"></span>SYNC STOP</button>
          </div>
        </div>

        <!-- ONE TOUCH SETTING (OTS) CON PANTALLA DE BANK Y BOTONES LATERALES PARA LOS 15 BANKS -->
        <div class="control-block">
          <div class="block-title">ONE TOUCH SETTING (OTS)</div>
          <div class="ots-bank-bar" style="display:flex;align-items:center;gap:6px;margin-bottom:6px;">
            <button type="button" id="btnOtsBankPrev" class="hw-btn small" title="Banco anterior (1-15)">◀</button>
            <div id="otsBankScreen" style="flex:1;background:#091422;border:1px solid #2b5482;border-radius:4px;padding:4px 8px;font-size:0.68rem;font-weight:800;color:#38bdf8;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">
              B01 • XP-10 / N364
            </div>
            <button type="button" id="btnOtsBankNext" class="hw-btn small" title="Banco siguiente (1-15)">▶</button>
          </div>
          <div class="grid-4">
            <button type="button" class="hw-btn ots-btn active" data-ots="0"><span class="led"></span>1</button>
            <button type="button" class="hw-btn ots-btn" data-ots="1"><span class="led"></span>2</button>
            <button type="button" class="hw-btn ots-btn" data-ots="2"><span class="led"></span>3</button>
            <button type="button" class="hw-btn ots-btn" data-ots="3"><span class="led"></span>4</button>
          </div>
        </div>

        <!-- PART SELECT / ON-OFF -->
        <div class="control-block">
          <div class="block-title">PART SELECT / ON-OFF</div>
          <div class="grid-3">
            <button type="button" id="btnPartR1" class="hw-btn led-blue active"><span class="led"></span>RIGHT 1</button>
            <button type="button" id="btnPartR2" class="hw-btn led-blue"><span class="led"></span>RIGHT 2</button>
            <button type="button" id="btnPartLeft" class="hw-btn led-blue active"><span class="led"></span>LEFT</button>
          </div>
          <div class="grid-2 mt-6">
            <button type="button" id="btnLeftHold" class="hw-btn led-amber"><span class="led"></span>LEFT HOLD</button>
            <button type="button" id="btnHarmony" class="hw-btn led-amber"><span class="led"></span>HARMONY/ECHO</button>
          </div>
        </div>

        <!-- MULTI PAD CONTROL -->
        <div class="control-block">
          <div class="block-title">MULTI PAD CONTROL</div>
          <div class="grid-4">
            <button type="button" class="hw-btn pad-btn" data-pad="0"><span class="led"></span>1</button>
            <button type="button" class="hw-btn pad-btn" data-pad="1"><span class="led"></span>2</button>
            <button type="button" class="hw-btn pad-btn" data-pad="2"><span class="led"></span>3</button>
            <button type="button" class="hw-btn pad-btn" data-pad="3"><span class="led"></span>4</button>
          </div>
          <button type="button" id="btnPadStop" class="hw-btn small mt-6 w-full">■ STOP PAD / AUDIO</button>
        </div>

        <!-- ACORDES RÁPIDOS -->
        <div class="control-block">
          <div class="block-title">CHORD FINGERING / C MAYOR</div>
          <div class="grid-4">
            <button type="button" class="hw-btn small chord-btn active" data-chord="C">C</button>
            <button type="button" class="hw-btn small chord-btn" data-chord="Dm">Dm</button>
            <button type="button" class="hw-btn small chord-btn" data-chord="Em">Em</button>
            <button type="button" class="hw-btn small chord-btn" data-chord="F">F</button>
            <button type="button" class="hw-btn small chord-btn" data-chord="G">G</button>
            <button type="button" class="hw-btn small chord-btn" data-chord="Am">Am</button>
            <button type="button" class="hw-btn small chord-btn" data-chord="Bdim">Bdim</button>
            <button type="button" class="hw-btn small chord-btn" data-chord="Db">Db</button>
          </div>
        </div>
      </section>
    </main>

    <!-- JOYSTICK + TECLADO FSB 61 TECLAS -->
    <section class="keyboard-section">
      <div id="joystickPad" class="joystick-pad" title="Pitch Bend / Modulation">
        <div id="joystickStick" class="joystick-stick"></div>
        <span class="joy-label">PITCH BEND</span>
      </div>
      <div id="keyboard" class="fsb-keyboard" aria-label="61-key keyboard"></div>
    </section>
  </div>

  <!-- SCRIPTS DEL MOTOR DE AUDIO, ESTILOS, SONIDOS Y APP -->
  <script src="js/gm-xg-map.js"></script>
  <script src="js/sound-library.js"></script>
  <script src="js/audio-engine.js"></script>
  <script src="js/sty-engine.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
